<!doctype html>
<html lang="it" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Chalet du Soleil | Modern Alpine Retreat</title>

		<!-- Google Fonts: async stylesheet to reduce render-blocking -->
		<link rel="dns-prefetch" href="https://fonts.googleapis.com" />
		<link rel="dns-prefetch" href="https://fonts.gstatic.com" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap"
			onload="
				this.onload = null;
				this.rel = 'stylesheet';
			"
		/>
		<noscript>
			<link
				href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap"
				rel="stylesheet"
			/>
		</noscript>

		<script>
			const measurementId = 'G-GGKFG688CK';
			const consentStorageKey = 'hds_cookie_consent_v1';

			gtag('consent', 'default', {
				analytics_storage: 'denied',
				ad_storage: 'denied',
				ad_user_data: 'denied',
				ad_personalization: 'denied',
				functionality_storage: 'granted',
				security_storage: 'granted'
			});

			gtag('config', 'G-GGKFG688CK', {
				send_page_view: false,
				anonymize_ip: true
			});

			window.__updateConsent = (consent) => {
				const analyticsGranted = Boolean(consent?.analytics);
				const marketingGranted = Boolean(consent?.marketing);

				window.gtag?.('consent', 'update', {
					analytics_storage: analyticsGranted ? 'granted' : 'denied',
					ad_storage: marketingGranted ? 'granted' : 'denied',
					ad_user_data: marketingGranted ? 'granted' : 'denied',
					ad_personalization: marketingGranted ? 'granted' : 'denied'
				});

				if (analyticsGranted) {
					loadGoogleTag();
				}
			};

			try {
				const rawConsent = localStorage.getItem(consentStorageKey);
				if (rawConsent) {
					const parsedConsent = JSON.parse(rawConsent);
					window.__cookieConsentState = parsedConsent;
					window.__updateConsent(parsedConsent);
				}
			} catch {
				// Ignore storage read errors
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
