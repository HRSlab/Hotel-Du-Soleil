<!doctype html>
<html lang="it" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Chalet du Soleil | Modern Alpine Retreat</title>

		<!-- Google Fonts: Cormorant Garamond (Eleganza) & Inter (Pulizia) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=Great+Vibes&display=swap"
			rel="stylesheet"
		/>

		<script>
			const measurementId = 'G-GGKFG688CK';
			const consentStorageKey = 'hds_cookie_consent_v1';

			window.dataLayer = window.dataLayer || [];
			window.gtag =
				window.gtag ||
				function () {
					window.dataLayer.push(arguments);
				};

			function loadGoogleTag() {
				if (window.__gaLoaded) return;

				const script = document.createElement('script');
				script.async = true;
				script.src = `https://www.googletagmanager.com/gtag/js?id=${measurementId}`;
				script.onload = () => {
					window.gtag?.('config', measurementId, {
						send_page_view: false,
						anonymize_ip: true
					});
				};
				document.head.appendChild(script);
				window.__gaLoaded = true;
			}

			window.gtag('js', new Date());
			window.gtag('consent', 'default', {
				analytics_storage: 'denied',
				ad_storage: 'denied',
				ad_user_data: 'denied',
				ad_personalization: 'denied',
				wait_for_update: 500
			});

			window.__updateConsent = (consent) => {
				const analyticsGranted = Boolean(consent?.analytics);
				const marketingGranted = Boolean(consent?.marketing);

				window.gtag?.('consent', 'update', {
					analytics_storage: analyticsGranted ? 'granted' : 'denied',
					ad_storage: marketingGranted ? 'granted' : 'denied',
					ad_user_data: marketingGranted ? 'granted' : 'denied',
					ad_personalization: marketingGranted ? 'granted' : 'denied'
				});

				if (analyticsGranted) {
					loadGoogleTag();
				}
			};

			try {
				const rawConsent = localStorage.getItem(consentStorageKey);
				if (rawConsent) {
					const parsedConsent = JSON.parse(rawConsent);
					window.__cookieConsentState = parsedConsent;
					window.__updateConsent(parsedConsent);
				}
			} catch {
				// Ignore storage read errors
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
